<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player Lite</title>

  <script src="/public/js/tailwindcss-3.4.17.js"></script>

  <link rel="stylesheet" href="/public/css/plyr-3.7.8.css" />
  <script src="/public/js/plyr-3.7.8.js"></script>

  <style>
      /* 自定义滚动条 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

      /* 黑胶唱片旋转动画 */
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .vinyl-spin { animation: spin 10s linear infinite; }
      .vinyl-paused { animation-play-state: paused; }

      /* Plyr 自定义主题色 (粉色) */
      :root { --plyr-color-main: #ec4899; }

      /* 文本截断 */
      .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>

<body class="bg-gray-50 h-screen w-screen overflow-hidden text-gray-700 font-sans">

<div class="flex flex-col md:flex-row h-full w-full max-w-[1920px] mx-auto bg-white shadow-xl overflow-hidden">

  <div class="w-full md:w-[600px] flex flex-col border-r border-gray-100 bg-white z-20 h-full">

            <div class="p-4 border-b border-gray-100 flex flex-wrap gap-3 items-center bg-white/95 backdrop-blur z-10 sticky top-0">
                <h1 class="font-bold text-pink-500 text-lg tracking-tight whitespace-nowrap"><i class="fas fa-music mr-2"></i>ASMR Lite</h1>
                <input id="folderSearch" type="text" placeholder="Title / VA / Tags" class="flex-1 min-w-[180px] px-3 py-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-200 focus:border-pink-300" />
                <select id="tagFilter" class="min-w-[130px] px-3 py-2 text-sm border border-gray-200 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-pink-200 focus:border-pink-300">
                    <option value="">All Tags</option>
                </select>
      <div class="flex gap-3 text-gray-400">
        <button class="hover:text-pink-500 transition"><i class="fas fa-bars"></i></button>
      </div>
    </div>

    <ul id="folderList" class="flex-1 overflow-y-auto p-2 space-y-1">
      <div class="text-center py-10 text-gray-400 text-sm">Loading...</div>
    </ul>

    <div class="p-3 border-t border-gray-100 flex justify-between items-center bg-gray-50 text-sm">
                <button id="prevPage" class="px-3 py-1.5 rounded-md bg-white border border-gray-200 hover:bg-pink-50 hover:text-pink-500 hover:border-pink-200 transition disabled:opacity-50">⮜ 上一页</button>
      <span id="pageInfo" class="font-mono text-gray-500">1/1</span>
                <button id="nextPage" class="px-3 py-1.5 rounded-md bg-white border border-gray-200 hover:bg-pink-50 hover:text-pink-500 hover:border-pink-200 transition disabled:opacity-50">下一页 ⮞</button>
    </div>
  </div>

  <div class="flex-1 flex flex-col h-full relative z-10 bg-white">

            <div class="bg-[#111827] relative w-full shrink-0 md:h-[45vh] flex flex-col justify-center items-center p-4 overflow-hidden group">

                <div id="playerBg" class="absolute inset-0 bg-cover bg-center opacity-20 blur-xl transition-all duration-700" style="background-image: url('');"></div>

      <div class="relative z-10 mb-6 hidden md:block">
                    <div id="vinylRecord" class="w-48 h-48 rounded-full bg-black border-4 border-gray-800 shadow-2xl flex items-center justify-center vinyl-paused">
                        <img id="vinylCover" src="/public/css/img.png?vinyl" class="w-32 h-32 rounded-full object-cover opacity-80" alt="Cover">
        </div>
      </div>

      <div class="w-full max-w-3xl z-20 shadow-lg rounded-xl overflow-hidden bg-black">
        <audio id="player" controls class="w-full"></audio>
      </div>

      <div class="mt-4 z-20 text-center px-4">
        <h3 id="mediaTitle" class="text-white font-medium text-lg line-clamp-1">未播放 / Not Playing</h3>
        <p id="mediaSubtitle" class="text-gray-400 text-sm mt-1">选择左侧列表开始播放 / Select from list</p>
        <div id="mediaVas" class="mt-2 flex justify-center flex-wrap gap-2"></div>
        <div id="mediaTags" class="flex flex-wrap gap-1 mt-2 justify-center"></div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto bg-white flex flex-col">
      <div class="px-6 py-4 border-b border-gray-100 sticky top-0 bg-white z-10 flex gap-4">
        <span class="px-3 py-1 bg-pink-500 text-white text-xs rounded-full font-bold">MP3 / WAV</span>
        <span class="text-gray-400 text-xs flex items-center">播放列表 / Play List</span>
      </div>

      <ul id="mediaList" class="p-2 space-y-1 pb-20">
        <li class="text-center text-gray-400 text-sm py-10">暂无媒体文件，请点击左侧目录 / No media files available. Please click the left-hand menu.</li>
      </ul>
    </div>
  </div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
  let currentPage = 1;
  let pageSize = 100;
  let player = null;

  let currentMediaList = [];
  let currentMediaIndex = -1;
  let currentFolder = null;
  let expandedSubfolders = new Set();
  let currentPlayingFilePath = null;

  let allFolders = [];
  document.addEventListener("DOMContentLoaded", () => {
    // 初始化 Plyr
    player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
      captions: { active: true, update: true, language: 'zh' }
    });

    // 监听播放事件控制黑胶动画
    player.on('playing', () => {
      document.getElementById('vinylRecord').classList.add('vinyl-spin');
      document.getElementById('vinylRecord').classList.remove('vinyl-paused');
    });
    player.on('pause', () => {
      document.getElementById('vinylRecord').classList.add('vinyl-paused');
    });
    player.on('ended', () => {
      playNextMedia();
    });

    loadFolders(currentPage);

    document.getElementById("prevPage").onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        loadFolders(currentPage);
      }
    };

    document.getElementById("nextPage").onclick = () => {
      currentPage++;
      loadFolders(currentPage);
    };
  });

  document.getElementById("folderSearch").addEventListener("input", applyFolderFilters);
  document.getElementById("tagFilter").addEventListener("change", applyFolderFilters);


  /** 加载目录列表 */
  function loadFolders(page) {
    // 模拟 loading 状态
    document.getElementById("folderList").innerHTML = '<div class="flex justify-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500"></div></div>';

    fetch(`/api/list?page=${page}&pageSize=${pageSize}`)
      .then(res => res.json())
      .then(json => {
        const data = json.data;
        allFolders = data.infos || [];
        renderTagFilterOptions(allFolders);
        applyFolderFilters();

        document.getElementById("pageInfo").innerText =
          `${data.page} / ${Math.ceil(data.total / data.pageSize)}`;

        // 更新翻页按钮状态
        document.getElementById("prevPage").disabled = data.page <= 1;
        document.getElementById("nextPage").disabled = data.page >= Math.ceil(data.total / data.pageSize);
      })
      .catch(err => {
        document.getElementById("folderList").innerHTML = `<div class="text-center py-10 text-red-400">加载失败: ${err}</div>`;
      });
  }


  function renderTagFilterOptions(folders) {
      const tagFilter = document.getElementById("tagFilter");
      const currentValue = tagFilter.value;
      const enTags = new Set();

      folders.forEach(folder => {
          (folder.tags || []).forEach(tag => {
              if (tag?.enName) enTags.add(tag.enName);
          });
      });

      const sortedTags = [...enTags].sort((a, b) => a.localeCompare(b));
      tagFilter.innerHTML = '<option value="">— All —</option>';

      const favoriteOption = document.createElement("option");
      favoriteOption.value = "__favorites__";
      favoriteOption.innerText = "★ Favorites";
      tagFilter.appendChild(favoriteOption);

      sortedTags.forEach(tagName => {
          const option = document.createElement("option");
          option.value = tagName;
          option.innerText = tagName;
          tagFilter.appendChild(option);
      });

      tagFilter.value = sortedTags.includes(currentValue) ? currentValue : "";
      if (currentValue === "__favorites__") {
        tagFilter.value = "__favorites__";
      }
  }

  function isFolderFavorite(folder) {
    const markerName = ".isfavorite";
    return (folder.files || []).some(file => {
      const rawPath = normalizePath(file.path || file.name || "").toLowerCase();
      if (!rawPath) return false;
      return rawPath === markerName || rawPath.endsWith(`/${markerName}`);
    });
  }

  function applyFolderFilters() {
      const searchInput = document.getElementById("folderSearch");
      const tagFilter = document.getElementById("tagFilter");
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedTag = tagFilter.value;

      if (!keyword && !selectedTag) {
          renderFolders(allFolders);
          return;
      }

      const filteredFolders = allFolders.filter(folder => {
          const title = (folder.name || "").toLowerCase();
          const vaNames = (folder.vas || []).map(va => (va?.name || "").toLowerCase());
          const enTagNames = (folder.tags || []).map(tag => (tag?.enName || "").toLowerCase());

          const searchMatched = !keyword ||
              title.includes(keyword) ||
              vaNames.some(name => name.includes(keyword)) ||
              enTagNames.some(tag => tag.includes(keyword));

            const tagMatched = !selectedTag ||
              (selectedTag === "__favorites__"
              ? isFolderFavorite(folder)
              : (folder.tags || []).some(tag => tag?.enName === selectedTag));

          return searchMatched && tagMatched;
      });

      renderFolders(filteredFolders);
  }

  /** 渲染目录 (卡片样式) */
  function renderFolders(folders) {
    const ul = document.getElementById("folderList");
    ul.innerHTML = "";

    folders.forEach((folder, folderIndex) => {
      if (folders.length === 0) {
          ul.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">没有匹配的目录 / No matching folders</div>';
          return;
      }

      const li = document.createElement("li");

      // 查找本地封面文件 (仅在根目录) (优先级: cover.* > thumbnail.*)
      let coverUrl = "/public/css/img.png"; // 默认占位图
      if (folder.files) {
        const coverFile = folder.files.find(f => 
          f.name.toLowerCase().startsWith('.workinfo_cover')
        );
      
        const thumbnailFile = folder.files.find(f => 
          f.name.toLowerCase().startsWith('.workinfo_thumbnail')
        );
        
        const imageFile = coverFile || thumbnailFile;
        if (imageFile) {
          coverUrl = folder.baseDir + "/" + folder.name + "/" + imageFile.name;
        }
      }

      // 生成卡片 HTML
      li.className = "group cursor-pointer rounded-xl p-3 hover:bg-gray-50 transition border border-transparent hover:border-pink-100 flex gap-3 items-center";
      const favoriteBadge = `
        <div class="w-6 h-36 shrink-0 flex items-start justify-center pt-1" ${isFolderFavorite(folder) ? 'title="Favorite"' : ''}>
          <span class="text-yellow-500 text-3xl ${isFolderFavorite(folder) ? '' : 'opacity-0'}">★</span>
        </div>
      `;
      li.innerHTML = `
        ${favoriteBadge}
        <div class="relative w-36 h-36 shrink-0">
            <img src="${coverUrl}" class="w-full h-full object-cover rounded-lg shadow-sm bg-gray-200" alt="cover">
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition rounded-lg"></div>
        </div>
        <div class="flex-1 min-w-0">
            <div class="font-bold text-gray-800 text-sm line-clamp-2 leading-tight mb-1 group-hover:text-pink-600 transition">${folder.name}</div>
            <div class="flex items-center gap-2 text-xs text-gray-400 mb-1">
                <span class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-500 font-mono">${folder.mediaId || 'RJ-----'}</span>
                <span><i class="fas fa-star text-yellow-400 mr-1"></i>${folder.rating || '0.0'}</span>
            </div>
            ${folder.vas && folder.vas.length > 0 ? `
            <div class="text-xs text-gray-600 line-clamp-1 mb-1">
                <i class="fas fa-microphone text-gray-400 mr-1"></i>${folder.vas.map(v => v.name).join(', ')}
            </div>
            ` : ''}
            ${folder.tags && folder.tags.length > 0 ? `
            <div class="flex flex-wrap gap-1">
                ${folder.tags.map(tag => tag?.enName && `
                <span class="text-xs bg-pink-100 text-pink-700 px-2 py-0.5 rounded whitespace-nowrap" title="${tag.jaName}">${tag.enName}</span>
                `).join('')}
            </div>
            ` : ''}
        </div>
        <button class="text-gray-300 hover:text-pink-500 p-2"><i class="far fa-heart"></i></button>
      `;

      li.onclick = (e) => {
        // 防止点击爱心触发播放
        if(e.target.closest('button')) return;
        onFolderClicked(folder, folderIndex);
      };

      ul.appendChild(li);
    });

    highlightCurrentFolder();
  }

  /** 点击目录 → 展示媒体文件 */
  function onFolderClicked(folder, folderIndex) {
    currentFolder = folder;
    highlightCurrentFolder();

    // 更新右侧标题区
    document.getElementById("mediaTitle").innerText = folder.name;
    document.getElementById("mediaSubtitle").innerText = folder.mediaId || "未知编号";

    // 更新声优
    const vasContainer = document.getElementById("mediaVas");
    vasContainer.innerHTML = "";
    if (folder.vas && folder.vas.length > 0) {
      folder.vas.forEach(va => {
        const vaBadge = document.createElement("span");
        vaBadge.className = "text-sm bg-blue-500 text-white px-3 py-1 rounded-full font-medium";
        vaBadge.innerText = va.name;
        vasContainer.appendChild(vaBadge);
      });
    }

    // 更新标签
    const tagsContainer = document.getElementById("mediaTags");
    tagsContainer.innerHTML = "";
    if (folder.tags && folder.tags.length > 0) {
      folder.tags.forEach(tag => {
        const tagSpan = document.createElement("span");
        tagSpan.className = "text-xs bg-pink-500 text-white px-2 py-0.5 rounded whitespace-nowrap";
        tagSpan.title = tag.jaName;
        tagSpan.innerText = tag.enName;
        tagsContainer.appendChild(tagSpan);
      });
    }

    // 尝试更新背景图和黑胶封面 (仅在根目录)
    // 优先级: cover.* > thumbnail.*
    let coverFile = folder.files.find(f => 
      f.name.toLowerCase().startsWith('.workinfo_cover') && 
      f.name.match(/\.(jpg|jpeg|png|webp)$/i) &&
      !f.name.includes('/')  // 仅在根目录
    );
    if (!coverFile) {
      coverFile = folder.files.find(f => 
        f.name.toLowerCase().startsWith('.workinfo_thumbnail') && 
        f.name.match(/\.(jpg|jpeg|png|webp)$/i) &&
        !f.name.includes('/')  // 仅在根目录
      );
    }
    if (coverFile) {
      const fullCoverPath = folder.baseDir + "/" + folder.name + "/" + coverFile.name;
      document.getElementById('vinylCover').src = fullCoverPath;
      document.getElementById('playerBg').style.backgroundImage = `url('${fullCoverPath}')`;
    } else {
      document.getElementById('vinylCover').src = "/public/css/img.png?vinyl";
      document.getElementById('playerBg').style.backgroundImage = "none";
    }

    const allFiles = folder.files || [];
    const mediaFiles = allFiles.filter(f => isAudioFileByName(f.name || f.path));

    currentMediaList = mediaFiles;
    currentMediaIndex = -1;
    currentPlayingFilePath = null;
    expandedSubfolders = new Set();

    renderMediaList(folder, allFiles);
  }

  function normalizePath(path) {
    return (path || "").replace(/\\/g, '/').replace(/^\/+/, '');
  }

  function isAudioFileByName(fileName) {
    return /\.(mp3|wav|flac)$/i.test(fileName || "");
  }

  function ensureFolderNode(root, dirParts) {
    let node = root;
    let currentFolderPath = '';

    dirParts.forEach(part => {
      currentFolderPath = currentFolderPath ? `${currentFolderPath}/${part}` : part;
      if (!node.folders.has(part)) {
        node.folders.set(part, { name: part, path: currentFolderPath, folders: new Map(), files: [] });
      }
      node = node.folders.get(part);
    });

    return node;
  }

  function buildFileTree(files) {
    const root = { folders: new Map(), files: [] };

    const normalizedEntries = files
      .map(file => {
        const originalPath = (file.path || file.name || "").replace(/\\/g, '/');
        const normalizedPath = normalizePath(originalPath).replace(/\/+$/, '');

        return {
          file,
          originalPath,
          normalizedPath
        };
      })
      .filter(entry => !!entry.normalizedPath);

    const inferredFolderPaths = new Set();
    normalizedEntries.forEach(({ normalizedPath }) => {
      const parts = normalizedPath.split('/').filter(Boolean);
      if (parts.length <= 1) return;

      for (let i = 1; i < parts.length; i++) {
        inferredFolderPaths.add(parts.slice(0, i).join('/'));
      }
    });

    normalizedEntries.forEach(({ file, originalPath, normalizedPath: rawPath }) => {
      if (!rawPath) return;

      const parts = rawPath.split('/').filter(Boolean);
      if (parts.length === 0) return;

      const lastPart = parts[parts.length - 1];
      const hasTrailingSlash = /\/$/.test(originalPath);
      const isMarkedDirectory = file.isDirectory === true || file.isDir === true || file.type === 'directory' || file.kind === 'directory';
      const shouldTreatAsDirectory = isMarkedDirectory || hasTrailingSlash || inferredFolderPaths.has(rawPath);

      if (shouldTreatAsDirectory) {
        ensureFolderNode(root, parts);
        return;
      }

      const fileName = lastPart;
      const dirParts = parts.slice(0, -1);

      const node = ensureFolderNode(root, dirParts);

      node.files.push({
        file,
        normalizedPath: rawPath,
        name: fileName,
        isAudio: isAudioFileByName(fileName)
      });
    });

    return root;
  }

  function folderContainsPlaying(folderPath) {
    if (!currentPlayingFilePath) return false;
    const currentPath = normalizePath(currentPlayingFilePath);
    const normalizedFolderPath = normalizePath(folderPath);
    return currentPath.startsWith(`${normalizedFolderPath}/`);
  }

  function renderTreeNode(ul, folder, node, depth) {
    const sortedFolders = [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name));
    const sortedFiles = [...node.files].sort((a, b) => a.name.localeCompare(b.name));

    sortedFolders.forEach(folderNode => {
      const isExpanded = expandedSubfolders.has(folderNode.path);
      const showFolderPlayingIndicator = folderContainsPlaying(folderNode.path) && !isExpanded;

      const folderLi = document.createElement("li");
      folderLi.className = "flex items-center gap-2 py-2 pr-3 rounded-lg bg-gray-50 hover:bg-pink-50 cursor-pointer transition border border-gray-100";
      folderLi.style.paddingLeft = `${12 + depth * 20}px`;
      folderLi.innerHTML = `
        <span class="text-xs text-gray-400 w-4">${isExpanded ? '▾' : '▸'}</span>
        <span class="text-sm">${isExpanded ? '📂' : '📁'}</span>
        <span class="text-sm font-medium text-gray-700 flex-1 truncate">${folderNode.name}</span>
        ${showFolderPlayingIndicator ? '<span class="text-xs text-pink-500">🔊</span>' : ''}
      `;

      folderLi.onclick = () => {
        if (isExpanded) {
          expandedSubfolders.delete(folderNode.path);
        } else {
          expandedSubfolders.add(folderNode.path);
        }
        renderMediaList(folder, folder.files || []);
      };

      ul.appendChild(folderLi);

      if (isExpanded) {
        renderTreeNode(ul, folder, folderNode, depth + 1);
      }
    });

    sortedFiles.forEach(({ file, normalizedPath, name, isAudio }) => {
      const isPlaying = normalizePath(currentPlayingFilePath) === normalizedPath;

      const fileLi = document.createElement("li");
      fileLi.className = isPlaying
        ? "flex items-center gap-3 py-2 pr-3 rounded-lg bg-pink-50 cursor-pointer group transition border-l-4 border-pink-500 shadow-sm"
        : "flex items-center gap-3 py-2 pr-3 rounded-lg hover:bg-pink-50 cursor-pointer group transition border-l-4 border-transparent";
      fileLi.style.paddingLeft = `${24 + depth * 20}px`;

      fileLi.innerHTML = `
        <span class="text-sm">${isAudio ? '🎵' : '📄'}</span>
        <div class="flex-1 text-sm ${isPlaying ? 'text-pink-600' : 'text-gray-700'} font-medium truncate group-hover:text-pink-600">${name}</div>
        ${isPlaying ? '<span class="text-xs text-pink-500">🔊</span>' : `<span class="text-xs text-gray-300 group-hover:text-pink-400">${(name.split('.').pop() || '').toUpperCase()}</span>`}
      `;

      fileLi.onclick = () => {
        if (isAudio) {
          currentMediaIndex = currentMediaList.findIndex(item => normalizePath(item.path) === normalizedPath);
          playMedia(folder, file);
          return;
        }

        const fileUrl = encodeURI(folder.baseDir + "/" + folder.name + "/" + (file.path || file.name));
        window.open(fileUrl, "_blank", "noopener,noreferrer");
      };

      ul.appendChild(fileLi);
    });
  }

  /** 渲染媒体文件列表 */
  function renderMediaList(folder, files) {
    const ul = document.getElementById("mediaList");
    ul.innerHTML = "";

    if (files.length === 0) {
      ul.innerHTML = '<div class="text-center py-10 text-gray-400">该目录下没有文件</div>';
      return;
    }

    const fileTree = buildFileTree(files);
    renderTreeNode(ul, folder, fileTree, 0);
  }

  /** 播放媒体并更新高亮 */
  function playMedia(folder, file) {
    if (currentMediaIndex < 0) {
      currentMediaIndex = currentMediaList.findIndex(item => item.path === file.path);
    }

    currentPlayingFilePath = normalizePath(file.path || file.name);

    const base = folder.baseDir + "/" + folder.name + "/" + file.path;
    const vttPath = base + ".vtt";
    const vttFileName = (file.path || file.name) + ".vtt";
    const subtitleExists = folder.files.some(f => f.path === vttFileName);

    // 设置 Plyr 源
    player.source = {
      type: 'audio',
      title: file.name,
      sources: [{ src: base, type: 'audio/mp3' }],
      tracks: subtitleExists ? [{
        kind: 'captions',
        label: '中文',
        srclang: 'zh',
        src: vttPath,
        default: true,
      }] : []
    };

    player.play();

    // 更新 UI 高亮
    updateMediaHighlight();

    // 让黑胶转起来
    document.getElementById('vinylRecord').classList.add('vinyl-spin');
    document.getElementById('vinylRecord').classList.remove('vinyl-paused');
  }

  function updateMediaHighlight() {
    if (!currentFolder) return;
    renderMediaList(currentFolder, currentFolder.files || []);
  }

  function highlightCurrentFolder() {
    if (!currentFolder) return;
    const lis = document.querySelectorAll("#folderList > li");
    lis.forEach(li => {
      // 这里简单判断 html 内容包含 name 即为选中，实际建议给 li 加 data-id 属性
      if (li.innerText.includes(currentFolder.name)) {
        li.classList.add("bg-pink-50", "border-pink-200");
        li.classList.remove("border-transparent");
      } else {
        li.classList.remove("bg-pink-50", "border-pink-200");
        li.classList.add("border-transparent");
      }
    });
  }

  /** 播放下一首 */
  function playNextMedia() {
    if (currentMediaList.length > 0 && currentMediaIndex + 1 < currentMediaList.length) {
      currentMediaIndex++;
      playMedia(currentFolder, currentMediaList[currentMediaIndex]);
    } else {
      // 切换目录逻辑 (保持原有逻辑，增加 UI 提示)
      const folderLis = document.querySelectorAll("#folderList > li");
      // 简单查找 index
      let currentFolderIndex = -1;
      folderLis.forEach((li, i) => { if(li.classList.contains('bg-pink-50')) currentFolderIndex = i; });

      const nextFolderIndex = currentFolderIndex + 1;

      if (nextFolderIndex < folderLis.length) {
        // 模拟点击下一章
        folderLis[nextFolderIndex].click();

        // 延迟一点播放，等待列表渲染
        setTimeout(() => {
          if (currentFolder && currentMediaList.length > 0) {
            currentMediaIndex = 0;
            playMedia(currentFolder, currentMediaList[0]);
          }
        }, 500);
      }
    }
  }

</script>

</body>
